name: Desktop release

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            platform: macos
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build pinned SilverScript compilers
        run: npm run setup:silverc

      - name: Build pinned local preflight engine
        run: npm run setup:kascov-preflight

      - name: Verify application and native helpers
        run: npm run verify

      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run desktop:build -- --bundles dmg

      - name: Smoke test packaged macOS local service
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$RUNNER_TEMP/kaspa-studio-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"

          backend_pid=""
          cleanup() {
            if [ -n "$backend_pid" ]; then
              kill "$backend_pid" 2>/dev/null || true
              wait "$backend_pid" 2>/dev/null || true
            fi
            hdiutil detach -quiet "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          app_bundle="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_bundle"
          node_bin="$app_bundle/Contents/MacOS/node"
          runtime="$app_bundle/Contents/Resources/runtime/app"
          test -x "$node_bin"
          test -f "$runtime/server/index.mjs"

          # Node/V8 crashes with SIGTRAP on Apple Silicon when Hardened Runtime
          # is enabled without the allow-jit entitlement.
          test "$("$node_bin" -e 'console.log(new Function("return 42")())')" = "42"

          log="$RUNNER_TEMP/kaspa-studio-macos-backend.log"
          data_dir="$RUNNER_TEMP/kaspa-studio-macos-data"
          mkdir -p "$data_dir"
          HOST=127.0.0.1 \
          PORT=4310 \
          STUDIO_DATA_DIR="$data_dir" \
          SILVERC_LATEST_BIN="$runtime/bin/silverc-latest" \
          SILVERC_LEGACY_BIN="$runtime/bin/silverc-legacy" \
          KASCOV_PREFLIGHT_BIN="$runtime/bin/kascov-preflight" \
            "$node_bin" "$runtime/server/index.mjs" >"$log" 2>&1 &
          backend_pid=$!

          healthy=false
          for attempt in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4310/api/health >"$RUNNER_TEMP/health.json"; then
              healthy=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if [ "$healthy" != true ]; then
            cat "$log"
            exit 1
          fi

          curl -fsS --max-time 5 http://127.0.0.1:4310/api/templates >"$RUNNER_TEMP/templates.json"
          "$node_bin" -e '
            const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(payload.templates) || payload.templates.length < 1) process.exit(1);
          ' "$RUNNER_TEMP/templates.json"

      - name: Stage macOS artifact
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$artifact"
          mkdir -p release-assets
          cp "$artifact" "release-assets/Kaspa-SilverScript-Studio-${version}-macos-arm64.dmg"

      - name: Build Windows installers
        if: matrix.platform == 'windows'
        run: npm run desktop:build -- --bundles nsis,msi

      - name: Smoke test packaged Windows local service
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path "src-tauri/target/release/app.exe").Path
          $process = Start-Process -FilePath $executable -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:4310/api/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $health -or -not $health.ok) {
              $log = Join-Path $env:APPDATA "io.kaspa.silverscript-studio/backend.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Packaged Windows local service did not become healthy"
            }
            $templates = (Invoke-RestMethod -Uri "http://127.0.0.1:4310/api/templates" -TimeoutSec 5).templates
            if (-not $templates -or $templates.Count -lt 1) {
              throw "Packaged Windows local service returned no templates"
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Stage Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $msi -or -not $setup) { throw "Windows MSI or NSIS installer is missing" }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $msi.FullName "release-assets/Kaspa-SilverScript-Studio-$version-windows-x64.msi"
          Copy-Item $setup.FullName "release-assets/Kaspa-SilverScript-Studio-$version-windows-x64-setup.exe"

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: npm run desktop:build -- --bundles deb,appimage

      - name: Stage Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          mkdir -p release-assets
          cp "$deb" "release-assets/Kaspa-SilverScript-Studio-${version}-linux-amd64.deb"
          cp "$appimage" "release-assets/Kaspa-SilverScript-Studio-${version}-linux-x86_64.AppImage"
          chmod +x "release-assets/Kaspa-SilverScript-Studio-${version}-linux-x86_64.AppImage"

      - name: Record artifact hashes
        run: node scripts/write-release-checksums.mjs release-assets "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Kaspa SilverScript Studio ${GITHUB_REF_NAME}" \
            "${notes_args[@]}"
